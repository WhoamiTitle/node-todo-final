<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Личный список дел. Итоговая работа по экосистеме Node.js." />
    <title>Список дел | Итоговая работа</title>
    <link rel="icon" href="./icons/clipboard-list.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <header class="page-header">
      <div class="brand">
        <img class="brand__icon" src="./icons/clipboard-list.svg" alt="" width="32" height="32" />
        <div>
          <p class="eyebrow">Итоговая работа</p>
          <h1>Список дел</h1>
        </div>
      </div>
      <button class="icon-button" id="logout" type="button" title="Выйти" aria-label="Выйти" hidden>
        <img src="./icons/log-out.svg" alt="" width="20" height="20" />
      </button>
    </header>
    <main id="main" class="page-main">
      <p id="error" class="notice notice--error" role="alert" hidden></p>
      <p id="status" class="visually-hidden" role="status"></p>
      <section id="sign-in" class="sign-in" aria-labelledby="sign-in-heading">
        <h2 id="sign-in-heading">Вход в список</h2>
        <form id="token-form">
          <fieldset>
            <legend class="visually-hidden">Авторизация</legend>
            <label for="token">Токен доступа</label>
            <div class="sign-in__controls">
              <input
                id="token"
                name="token"
                type="password"
                autocomplete="off"
                spellcheck="false"
                required
                minlength="32"
                maxlength="256"
              />
              <button class="primary-button" type="submit">
                <img src="./icons/key-round.svg" alt="" width="18" height="18" />Войти
              </button>
            </div>
          </fieldset>
        </form>
      </section>
      <div id="workspace" class="workspace" hidden>
        <aside class="sidebar" aria-label="Автор и выбор списка">
          <section class="author" aria-labelledby="author-name">
            <p class="eyebrow">Автор</p>
            <h2 id="author-name">Автор списка</h2>
            <p id="author-login" class="author__login"></p>
          </section>
          <section class="list-switcher" aria-labelledby="lists-heading">
            <h2 id="lists-heading" class="eyebrow">Списки</h2>
            <button id="personal-list" class="list-shortcut" type="button" aria-current="true">
              <img src="./icons/notebook-pen.svg" alt="" width="18" height="18" />
              <span id="personal-list-name">Мои дела</span>
              <code>manual</code>
            </button>
            <form id="run-form" class="run-form">
              <label for="run-id">Другой список</label>
              <div class="run-form__controls">
                <input
                  id="run-id"
                  name="runId"
                  placeholder="Код списка"
                  required
                  maxlength="64"
                  pattern="[A-Za-z0-9_\-]{1,64}"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button
                  class="icon-button"
                  type="submit"
                  title="Открыть список"
                  aria-label="Открыть список"
                >
                  <img src="./icons/arrow-right.svg" alt="" width="18" height="18" />
                </button>
              </div>
            </form>
          </section>
          <dl class="totals">
            <div>
              <dt>Всего</dt>
              <dd id="total-count">0</dd>
            </div>
            <div>
              <dt>В работе</dt>
              <dd id="active-count">0</dd>
            </div>
            <div>
              <dt>Готово</dt>
              <dd id="done-count">0</dd>
            </div>
          </dl>
        </aside>
        <section class="task-section" aria-labelledby="list-heading">
          <div class="list-header">
            <div>
              <p class="eyebrow">Текущий список</p>
              <h2 id="list-heading">Мои дела</h2>
            </div>
            <button
              id="refresh"
              class="icon-button"
              type="button"
              title="Обновить из базы данных"
              aria-label="Обновить из базы данных"
            >
              <img src="./icons/refresh-cw.svg" alt="" width="20" height="20" />
            </button>
          </div>
          <form id="create-form" class="create-form">
            <fieldset>
              <legend class="visually-hidden">Добавление дела</legend>
              <label for="new-title">Новое дело</label>
              <div class="create-form__controls">
                <input id="new-title" name="title" required autocomplete="off" />
                <button class="primary-button" type="submit">
                  <img src="./icons/plus.svg" alt="" width="20" height="20" />Добавить
                </button>
              </div>
            </fieldset>
          </form>
          <fieldset class="status-filter">
            <legend class="visually-hidden">Статус дел</legend>
            <label><input type="radio" name="status" value="all" checked /><span>Все</span></label>
            <label><input type="radio" name="status" value="active" /><span>В работе</span></label>
            <label><input type="radio" name="status" value="done" /><span>Готово</span></label>
          </fieldset>
          <ul id="tasks" class="tasks" aria-label="Дела"></ul>
          <div id="empty" class="empty" hidden>
            <img src="./icons/list-checks.svg" alt="" width="40" height="40" />
            <p id="empty-text">В этом списке пока нет дел</p>
          </div>
        </section>
      </div>
      <noscript
        ><p class="notice">Для работы со списком необходимо включить JavaScript.</p></noscript
      >
    </main>

    <template id="task-template">
      <li class="task">
        <label class="task__toggle"><input class="task__done" type="checkbox" /></label>
        <div class="task__body">
          <p class="task__title"></p>
          <span class="task__date"></span>
        </div>
        <div class="task__actions">
          <button
            class="icon-button"
            data-action="edit"
            type="button"
            title="Изменить название"
            aria-label="Изменить название"
          >
            <img src="./icons/pencil.svg" alt="" width="18" height="18" />
          </button>
          <button
            class="icon-button icon-button--danger"
            data-action="delete"
            type="button"
            title="Удалить дело"
            aria-label="Удалить дело"
          >
            <img src="./icons/trash-2.svg" alt="" width="18" height="18" />
          </button>
        </div>
      </li>
    </template>

    <dialog id="edit-dialog" class="dialog" aria-labelledby="edit-heading">
      <form id="edit-form">
        <fieldset>
          <legend class="visually-hidden">Редактирование</legend>
          <h2 id="edit-heading">Изменить дело</h2>
          <label for="edit-title">Название</label>
          <input id="edit-title" name="title" required autocomplete="off" />
          <p class="dialog__error" role="alert" hidden></p>
          <div class="dialog__actions">
            <button class="secondary-button" data-close type="button">Отмена</button>
            <button class="primary-button" type="submit">
              <img src="./icons/check.svg" alt="" width="18" height="18" />Сохранить
            </button>
          </div>
        </fieldset>
      </form>
    </dialog>
    <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-heading">
      <form id="delete-form">
        <fieldset>
          <legend class="visually-hidden">Удаление</legend>
          <h2 id="delete-heading">Удалить дело?</h2>
          <p id="delete-title" class="dialog__task-title"></p>
          <p class="dialog__error" role="alert" hidden></p>
          <div class="dialog__actions">
            <button class="secondary-button" data-close type="button" autofocus>Отмена</button>
            <button class="danger-button" type="submit">
              <img src="./icons/trash-2.svg" alt="" width="18" height="18" />Удалить
            </button>
          </div>
        </fieldset>
      </form>
    </dialog>
  </body>
</html>
