name: TODO quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_admin
          MONGO_INITDB_ROOT_PASSWORD: disposable-ci-only
        ports:
          - 27017/tcp
        options: >-
          --health-cmd 'mongosh --quiet --eval "db.adminCommand({ping:1}).ok"'
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install locked dependencies and generate icons
        run: |
          npm ci --ignore-scripts
          npm run assets
      - name: Lint, format and HTTP unit contracts
        run: npm run check
      - name: PHP gateway and deployment regression tests
        run: |
          for file in deploy/helios/*.php; do php -l "$file"; done
          npm run test:deployment
      - name: Independent MongoDB CRUD and restart contracts
        env:
          MONGO_ADMIN_URI: mongodb://ci_admin:disposable-ci-only@127.0.0.1:${{ job.services.mongo.ports['27017'] }}/admin?authSource=admin&directConnection=true
        run: node --test --test-concurrency=1 tests/integration/*.test.mjs
      - name: Verify real Apache routing and Authorization forwarding
        run: npm run test:apache
      - name: Check shell helpers
        run: |
          for file in scripts/*.sh deploy/helios/*.sh tests/helpers/*.sh tests/fixtures/*.sh; do sh -n "$file"; done
          docker run --rm --volume "$PWD:/mnt" \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            -x scripts/*.sh deploy/helios/*.sh tests/helpers/*.sh tests/fixtures/*.sh
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
